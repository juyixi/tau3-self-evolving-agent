tau2:
  repo_path: external/tau2-bench
  domain: retail
  train_split: train
  eval_split: test
  user_llm: Qwen/Qwen3.5-9B
  user_llm_args: {}
  solo_mode: true
model:
  base_model: Qwen/Qwen3.5-9B
lora:
  use_peft: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
rollout:
  temperature: 1.0
  top_p: 0.95
  max_episode_steps: 40
memory:
  tiers: [trajectory, tip, skill, tool]
  retrieve_top_k: 50
  teacher_memory_cap: 20
  score_threshold: 0.01
  maintenance_period: 30
training:
  seed: 42
