tau2:
  repo_path: external/tau2-bench
  domain: airline
  train_split: train
  eval_split: test
  user_llm: deepseek/deepseek-v4-pro
  user_llm_args:
    thinking:
      type: disabled
    temperature: 0.0
    max_tokens: 8192
  solo_mode: false
model:
  base_model: Qwen/Qwen3.5-9B
lora:
  use_peft: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
rollout:
  temperature: 1.0
  top_p: 0.95
  max_episode_steps: 40
  max_concurrency: 8
memory:
  enabled: true
  agent_id: airline
  tiers: [trajectory, tip, skill, tool]
  retrieve_top_k: 50
  teacher_memory_cap: 20
  score_threshold: 0.01
  maintenance_period: 30
  maintenance_tip_capacity: 200
  maintenance_similarity_threshold: 0.92
  maintenance_priority_pair_limit: 24
  max_new_tips_per_episode: 2
  max_new_skills_per_episode: 1
  max_new_tools_per_episode: 1
  max_new_trajectories_per_episode: 1
  embedding_provider: local
  embedding_model: Qwen/Qwen3-Embedding-0.6B
  embedding_device: cuda
  embedding_dtype: float16
  embedding_max_length: 2048
  embedding_batch_size: 16
  embedding_cache: true
slow_loop:
  tier_priors:
    trajectory: 0.9
    tip: 0.8
    skill: 1.0
    tool: 1.2
  redundancy_threshold: 0.90
  max_redundancy_pairs: 50
training:
  seed: 42
  dtype: bfloat16
  target_modules: all-linear
  max_sequence_length: 8192
  gradient_checkpointing: true
  learning_rate: 1.0e-5
  per_device_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  generation_max_new_tokens: 512
  loss_type: forward_kl
pipeline:
  iteration_task_count: 30
  shuffle_train_tasks: true
evaluation:
  nl_assertions:
    model: deepseek/deepseek-v4-pro
    model_args:
      temperature: 0.0
      thinking:
        type: disabled
    api_key_env: DEEPSEEK_API_KEY
