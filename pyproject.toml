[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tau3-retail-evolver"
version = "0.1.0"
description = "Tau2 Retail and Airline OPD evolver"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6.0,<7",
    "audioop-lts>=0.2.2,<1; python_version >= '3.13'",
]

[project.optional-dependencies]
training = [
    "accelerate>=1.12",
    "peft>=0.19",
    "safetensors>=0.6",
    "torch>=2.7",
    "transformers>=5.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "opd_gpu_smoke: trains one cached Qwen3.5 example when RUN_OPD_GPU_SMOKE=1",
    "tau2_integration: runs the real Tau2 retail checkout when RUN_TAU2_INTEGRATION=1",
]

[tool.setuptools.packages.find]
where = ["src"]
